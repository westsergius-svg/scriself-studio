[project]
name = "scriborium"
version = "1.1.3.1"
description = "Scriborium desktop app for Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7.0",
    "pyspellchecker>=0.9.0",
    "spylls>=0.1.12",
]

[project.scripts]
scriborium = "scriborium.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scriborium = ["resources/lang/*.json", "resources/hunspell/**/*.aff", "resources/hunspell/**/*.dic"]
